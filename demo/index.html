<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Checkout</title>
    <!--
      The page recdr records for the landing page (see RECORDING.md).
      The bar and the toast move because recdr stores only frames that
      changed: a page that jumps between states leaves three or four frames.
    -->
    <style>
      body {
        margin: 0;
        background: #f3f4f6;
        color: #16181d;
        font-family: system-ui, sans-serif;
      }

      main {
        width: 420px;
        margin: 64px auto 0;
        padding: 28px;
        border: 1px solid #dfe2e8;
        border-radius: 12px;
        background: #fff;
      }

      h1 {
        margin: 0 0 20px;
        font-size: 22px;
      }

      dl {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px 16px;
        margin: 0 0 24px;
        font-size: 15px;
      }

      dd {
        margin: 0;
        text-align: right;
      }

      .total {
        padding-top: 10px;
        border-top: 1px solid #dfe2e8;
        font-weight: 600;
      }

      #buy {
        width: 100%;
        height: 48px;
        border: 0;
        border-radius: 8px;
        background: #16181d;
        color: #fff;
        font: inherit;
        font-size: 16px;
        cursor: pointer;
      }

      #buy:disabled {
        background: #6b7280;
        cursor: default;
      }

      .bar {
        height: 4px;
        margin-top: 10px;
        overflow: hidden;
        border-radius: 2px;
        background: #e5e7eb;
      }

      .bar span {
        display: block;
        width: 0;
        height: 100%;
        background: #16181d;
      }

      .bar.run span {
        width: 100%;
        transition: width 600ms linear;
      }

      .toast {
        position: fixed;
        bottom: 40px;
        left: 50%;
        padding: 14px 22px;
        border-radius: 8px;
        background: #0f7b3f;
        color: #fff;
        font-size: 15px;
        opacity: 0;
        transform: translate(-50%, 16px);
        transition:
          transform 300ms,
          opacity 300ms;
      }

      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Order summary</h1>
      <dl>
        <dt>Mechanical keyboard</dt>
        <dd>$89.00</dd>
        <dt>Shipping</dt>
        <dd>$6.00</dd>
        <dt class="total">Total</dt>
        <dd class="total">$95.00</dd>
      </dl>
      <button id="buy" type="button">Buy</button>
      <div class="bar"><span></span></div>
    </main>
    <script>
      const buy = document.getElementById('buy');
      const bar = document.querySelector('.bar');

      buy.addEventListener('click', () => {
        buy.disabled = true;
        buy.textContent = 'Processing…';
        bar.classList.add('run');

        setTimeout(() => {
          buy.textContent = 'Paid';
          const toast = document.createElement('div');
          toast.className = 'toast';
          toast.setAttribute('role', 'status');
          toast.textContent = 'Payment accepted';
          document.body.append(toast);
          // Two frames, so the browser paints the start state before it moves.
          requestAnimationFrame(() =>
            requestAnimationFrame(() => toast.classList.add('show')),
          );
          // 300 ms to arrive, 1500 ms on screen, 300 ms to leave.
          setTimeout(() => {
            toast.classList.remove('show');
            setTimeout(() => toast.remove(), 300);
          }, 1800);
        }, 600);
      });
    </script>
  </body>
</html>
