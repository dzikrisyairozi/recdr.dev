version: 2
updates:
  # Single monthly update for all dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    target-branch: 'main'
    schedule:
      interval: 'monthly'
      time: '09:00'
    open-pull-requests-limit: 1
    reviewers:
      - '@dzikrisyairozi'
    assignees:
      - '@dzikrisyairozi'
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore'
      include: 'scope'
    # Group ALL updates into single PR
    groups:
      weekly-updates:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
          - 'major'
    # typescript-eslint 8 does not run on TypeScript 7 or later
    # (typescript-eslint/typescript-eslint#10940, #12518).
    # See docs/adr/0001-toolchain-pins.md.
    ignore:
      - dependency-name: 'typescript'
        versions: ['>=7']

  # GitHub Actions updates (separate from npm deps)
  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'main'
    schedule:
      interval: 'monthly'
      time: '10:00'
    open-pull-requests-limit: 1
    reviewers:
      - '@dzikrisyairozi'
    assignees:
      - '@dzikrisyairozi'
    commit-message:
      prefix: 'ci'
      include: 'scope'
    groups:
      github-actions-updates:
        patterns:
          - '*'
